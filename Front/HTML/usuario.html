<!DOCTYPE HTML>
<html>
    <head>
        <!--Carga biblioteca de estilos-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../CSS/main.css">
        <link rel="stylesheet" href="../CSS/tema.css">
        <script src="../JS/tema.js"></script>
        <meta charset="utf-8" lang="es">
        <title>Lana&Lino - Mi Perfil</title>
    </head>
    <body>
        <header>
            <p id="nombre">Lana&Lino</p>
            <div class="derecha">
                <button type="button" id="boton-volver-perfil"><i class="fa-solid fa-arrow-left"></i> Volver</button>
            </div>
        </header>

        <main>
            <form class="registro-formulario" id="formPerfil">
                <!--Formulario con los datos del usuario-->
                <h2 class="titulo-perfil">Mis datos</h2>

                <label>
                    <input type="email" id="email" placeholder="Correo" disabled>
                </label>

                <label>
                    <input type="text" name="nombre" id="nombre-input" placeholder="Nombre" required>
                </label>

                <label>
                    <input type="text" name="apellido" id="apellido-input" placeholder="Apellido" required>
                </label>

                <label>
                    <input type="tel" name="telefono" id="telefono-input" placeholder="Telfono" required>
                </label>

                <label>
                    <input type="text" name="direccion" id="direccion-input" placeholder="Direccin" required>
                </label>

                <button type="submit" class="btn-guardar-perfil">Guardar cambios</button>
            </form>
        </main>

        <footer>
            <p>Email:contacto@lanaylino.com</p>
            <p>Tel:+54 342 764 6657</p>
            <p>WSP:+54 342 563 6628</p>
            <a href="#">Instagram</a><br>
            <a href="#">TikTok</a><br>
            <a href="#">FaceBook</a><br>
            <p>Desarrollado por: Aarn Juarez</p><br>
            <p> 2026 Lana&Lino - Todos los derechos reservados</p>
        </footer>

        <div id="contenedor-notificaciones"></div>

        <script src="../JS/usuario.js"></script>
    </body>
</html>
