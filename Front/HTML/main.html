<!doctype html>
<html>
    <head>
        <!--Carga biblioteca de estilos-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../CSS/main.css">
        <link rel="stylesheet" href="../CSS/tema.css">
        <script src="../JS/tema.js"></script>
        <meta charset="utf-8" lang="es">
        <title>Lana&Lino</title>
    </head>

    <body>
        <header>
            <!--Lado izquierdo del encabezado-->
            <!--Barra busqueda, clasificación por clases y boton de favoritos-->
            <div class="izquierda">
            <div class="barraBusqueda">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" name="busqueda" placeholder="Buscar...">
                <button type="submit" class="btn-busqueda">Buscar</button>
            </div>
            <select name="categorias" class="categorias-ropa">
                <option value="" selected disabled>Categorias</option>
                <option value="productos">Productos</option>
                <option value="remeras">Remeras</option>
                <option value="buzos">Buzos</option>
                <option value="camperas">Camperas</option>
                <option value="bermudas">Bermudas</option>
                <option value="pantalones">Pantalones</option>
                <option value="zapatillas">Zapatillas</option>
            </select>
            <button type="button" id="boton-favoritos-main"><i class="fa-solid fa-bookmark"></i></button>
            </div>
            <p id="nombre">Lana&Lino</p>

            <!--Lado derecho del encabezado-->
            <!--Boton carrito, modo oscuro, inicio de sesión, cerrar sesióny perfil-->
            <div class="derecha">
                <button type="button" id="boton-carrito-main"><i class="fa-solid fa-cart-shopping"></i></button>
                <button type="button" id="boton-modo-oscuro"><i class="fa-solid fa-moon"></i></button>
                <button type="button" id="boton-inicio-main">Inicio sesion</button>
                <button type="button" id="boton-cerrar-sesion-main">Cerrar sesion</button>
                <button type="button" id="boton-perfil-main"><i class="fa-solid fa-user"></i> Perfil</button>
            </div>
        </header>

        <main>
            <!--Donde se cargan las imagenes-->
            <div class="contenedor-productos">
            </div>
        </main>

        <footer>
            <p>Email:contacto@lanaylino.com</p>
            <p>Tel:+54 342 764 6657</p>
            <p>WSP:+54 342 563 6628</p>
            <a href="#">Instagram</a><br>
            <a href="#">TikTok</a><br>
            <a href="#">FaceBook</a><br>
            <p>Desarrollado por: Aarón Juarez</p><br>
            <p>© 2026 Lana&Lino - Todos los derechos reservados</p>
        </footer>
        <script src="../JS/main.js"></script>
    </body>
</html>
