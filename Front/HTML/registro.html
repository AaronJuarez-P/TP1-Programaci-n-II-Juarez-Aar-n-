<!DOCTYPE HTML>
<html>
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="../CSS/formRegistro.css">
        <title>Lana&Lino-Registro</title>
    </head>
    <body>
        <header>
            <p id="nombre">Lana&Lino</p>
        </header>
        <main>
            <form class="registro-formulario" id="formRegistro">
                <input type="text" name="nombre" placeholder="Nombre"required>
                <input type="text" name="apellido" placeholder="Apellido" required>
                <input type="text" name="direccion" placeholder="Dirección" required>
                <input type="tel" name="telefono" placeholder="Telefono" required>
                <input type="email" name="correo" placeholder="Correo electronico" required>
                <div class="password-container">
                <input type="password" name="contraseña" placeholder="Contraseña" required>
                <button type="button"><i class="fa-solid fa-eye"></i></button>
                </div>
                <button type="submit" id="btnRegistro">Registrarse</button>
                <button type="button" id="btnInicioRegistro">Iniciar sesion</button>
            </form>
        </main>
        <footer>
            <p>Email:contacto@lanaylino.com</p>
            <p>Tel:+54 342 764 6657</p>
            <p>WSP:+54 342 563 6628</p>
            <a href="#">Instagram</a><br>
            <a href="#">TikTok</a><br>
            <a href="#">FaceBook</a><br>

        </footer>
        <script src="../JS/registro.js"></script>
    </body>
</html>
