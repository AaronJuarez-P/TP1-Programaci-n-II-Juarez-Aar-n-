<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <meta charset="utf-8" lang="es">
        <title>Lana&Lino</title>
    </head>

    <body>
        <header>
            <p>Lana&Lino</p>
            <button type="button"><i class="fa-solid fa-bookmark"></i></button>
            <button type="button"><i class="fa-solid fa-cart-shopping"></i></button>
            <div class="barraBusqueda">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" name="busqueda" placeholder="Buscar...">
            </div>
            <select name="categorias">
                <option value="" selected disabled>Categorias</option>
                <option value="remeras">Remeras</option>
                <option value="buzos">Buzos</option>
                <option value="camperas">Camperas</option>
                <option value="bermudas">Bermudas</option>
                <option value="pantalones">Pantalones</option>
                <option value="zapatillas">Zapatillas</option>
                <option value="ropa-interior">Ropa interior</option>
            </select>
            <div>
                <button type="button">Inicio sesion</button>
                <button type="button">Cerrar sesion</button>
                <button type="button"><i class="fa-solid fa-user"></i> Perfil</button>
            </div>
        </header>


        <footer>

        </footer>
    </body>
</html>
